[tool.poetry]
name = "caps"
version = "0.2.0"
description = "Clean Architecture Python SDK"
authors = ["Mayank Sharma <imptodefeat@gmail.com>", "Luis Alejandro Bordo García <bgluiszz@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "lib"}]

[tool.poetry.dependencies]
python = "^3.13"
dependency-injector = "^4.44.0"
pydantic = "^2.10.4"

[tool.poetry.group.fastapi.dependencies]
fastapi = "^0.115.4"

[tool.poetry.group.sqla.dependencies]
SQLAlchemy = "^2.0.36"
SQLAlchemy-Utils = "^0.41.2"
alembic = "^1.14.0"
PyYAML = "^6.0.2 "
psycopg2-binary = "^2.9.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-env = "^1.1.5"
black = "^24.10.0"
mypy = "^1.14.0"
types-PyYAML = "^6.0.12"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
exclude = [
  "tests/types",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.black]
line-length = 120
target-version = ['py313']
include = '\.pyi?$'
# 'extend-exclude' excludes files or directories in addition to the defaults
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/foo.py    # exclude a file named foo.py in the root of the project
  | .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
'''
